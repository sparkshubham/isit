   <section class="login-page">
       <div class="container">
           <div class="row justify-content-center align-items-center">
               <div class="col-md-6">
                  <div class="login-form">
                        <div class="login-icon" style="background: url('images/login-icon-bg.svg');">

                        </div>
                        <h3>Email Verification</h3>
                        <p>Please enter the verification code sent to: <strong>john.smith@gmail.com</strong></p>
                        <form action="">
                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <ul class="otp-inputs">
                                        <li>
                                            <input class="form-control" type="text" placeholder="0">
                                        </li>
                                        <li>
                                            <input class="form-control" type="text" placeholder="0">
                                        </li>
                                        <li>
                                            <input class="form-control" type="text" placeholder="0">
                                        </li>
                                        <li>
                                            <input class="form-control" type="text" placeholder="0">
                                        </li>
                                    </ul>
                                </div>
                                <div class="col-md-12">
                                    <button class="btn btn-primary">Submit</button>
                                </div>
                                
                                <div class="col-md-12 text-center">                                    
                                    <div class="dont-have-account mt-3">
                                        <p class="mb-0">Didn't receive code? <a href="">Request again</a></p>
                                    </div>
                                </div>
                            </div>
                        </form>
                  </div>
               </div>
           </div>
