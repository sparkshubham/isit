<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISIT Login</title>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- ============= COMPONENT ============== -->
<nav class="navbar navbar-expand-lg fixed-top navbar-light shadow-sm my-navbar">
    <div class="container-fluid">
        <a class="navbar-brand" href="#"><img class="d-none d-md-block " src="images/logo.png" alt=""> <img class="d-block d-md-none" src="images/logo-mobile.png" alt=""></a>    
    </div> <!-- container-fluid.// -->
   </nav>
   <!-- ============= COMPONENT //end ============== -->

   <section class="login-page">
       <div class="container">
           <div class="row justify-content-center align-items-center">
               <div class="col-md-6">
                   <div class="login-img">
                    <img src="images/login-img.png" alt="">
                    </div>
                    <div class="login-app-icons">
                        <ul>
                            <li><a href=""><img src="images/google-play-store.svg" alt=""></a></li>
                            <li><a href=""><img src="images/ios-play-store.svg" alt=""></a></li>
                        </ul>
                    </div>
               </div>
               <div class="col-md-6">
                  <div class="login-form">
                        <h3>Login</h3>
                        <p>Please login to your account.</p>
                        <form action="">
                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <div class="form-input">
                                        <input class="form-control" type="email" placeholder="Email address">
                                    </div>
                                </div>
                                <div class="col-md-12 mb-3">
                                    <div class="form-input">
                                        <!-- <input class="form-control" type="password" placeholder="Password"> -->
                                        <input name="password" type="password" value="" class="form-control" id="password" placeholder="Password" />
                                        <span class="eyeicon">
                                            <i toggle="#password" class="uil uil-eye" id="show_eye"></i>
                                        </span>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <button class="btn btn-primary">Log In</button>
                                </div>
                                
                                <div class="col-md-12 text-center">
                                    <a href="forgot-password.html" class="forgot-password">Forgot Password</a>
                                </div>
                            </div>
                        </form>
                  </div>
                  <div class="dont-have-account">
                      <p>Don't have an account? <a href="register.html">Sign Up</a></p>
                  </div>
               </div>
           </div>
       </div>
   </section>

   <footer class="footer-section">
        <div class="container">
            <div class="copyright">© 2022 ISIT. All rights reserved.</div>
        </div>
   </footer>

<script src="js/jquery-3.6.0.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/custom.js"></script>
</body>
</html>
