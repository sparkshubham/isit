<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISIT Set New Password</title>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- ============= COMPONENT ============== -->
<nav class="navbar navbar-expand-lg fixed-top navbar-light shadow-sm my-navbar">
    <div class="container-fluid">
        <a class="navbar-brand" href="#"><img class="d-none d-md-block " src="images/logo.png" alt=""> <img class="d-block d-md-none" src="images/logo-mobile.png" alt=""></a>
     </div> <!-- container-fluid.// -->
   </nav>
   <!-- ============= COMPONENT //end ============== -->

   <section class="login-page">
       <div class="container">
           <div class="row justify-content-center align-items-center">
               <div class="col-md-6">
                  <div class="login-form">
                        <div class="login-icon" style="background: url('images/login-icon-bg.svg');">
                            <img src="images/lock.svg" alt="Lock">
                        </div>
                        <h3>Set Password</h3>
                        <p>Kindly set your password for future logins.</p>
                        <form action="">
                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <div class="form-input">
                                        <!-- <input class="form-control" type="password" placeholder="Password"> -->
                                        <input name="password" type="password" value="" class="form-control" id="NewPassword" placeholder="New Password" />
                                        <span class="eyeicon">
                                            <i toggle="#NewPassword" class="uil uil-eye" id="show_eye"></i>
                                        </span>
                                    </div>
                                </div>
                                <div class="col-md-12 mb-3">
                                    <div class="form-input">
                                        <!-- <input class="form-control" type="password" placeholder="Password"> -->
                                        <input name="password" type="password" value="" class="form-control" id="ConfirmNewPassword" placeholder="Confirm New Password" />
                                        <span class="eyeicon">
                                            <i toggle="#ConfirmNewPassword" class="uil uil-eye" id="show_eye"></i>
                                        </span>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <button class="btn btn-primary">Submit</button>
                                </div>
                            </div>
                        </form>
                  </div>
               </div>
           </div>
       </div>
   </section>

   <footer class="footer-section">
        <div class="container">
            <div class="copyright">© 2022 ISIT. All rights reserved.</div>
        </div>
   </footer>

<script src="js/jquery-3.6.0.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/custom.js"></script>
</body>
</html>
