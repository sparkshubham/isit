<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISIT Register</title>
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- ============= COMPONENT ============== -->
<nav class="navbar navbar-expand-lg fixed-top navbar-light shadow-sm my-navbar">
    <div class="container-fluid">
        <a class="navbar-brand" href="#"><img class="d-none d-md-block " src="images/logo.png" alt=""> <img class="d-block d-md-none" src="images/logo-mobile.png" alt=""></a>
    </div> <!-- container-fluid.// -->
   </nav>
   <!-- ============= COMPONENT //end ============== -->

   <section class="login-page">
       <div class="container">
           <div class="row justify-content-center align-items-center">
               <div class="col-md-6">
                   <div class="login-img">
                    <img src="images/login-img.png" alt="">
                    </div>
                    <div class="login-app-icons">
                        <ul>
                            <li><a href=""><img src="images/google-play-store.svg" alt=""></a></li>
                            <li><a href=""><img src="images/ios-play-store.svg" alt=""></a></li>
                        </ul>
                    </div>
               </div>
               <div class="col-md-6">
                  <div class="login-form">
                        <h3>Sign Up</h3>
                        <p>We would love you to join us</p>
                        <form action="">
                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <div class="form-input">
                                        <input class="form-control" type="text" placeholder="First Name">
                                    </div>
                                </div>
                                <div class="col-md-12 mb-3">
                                    <div class="form-input">
                                        <input class="form-control" type="text" placeholder="Last Name">
                                    </div>
                                </div>
                                <div class="col-md-12 mb-3">
                                    <div class="form-input">
                                        <input class="form-control" type="email" placeholder="Email address">
                                    </div>
                                </div>
                                <div class="col-md-12 mb-3">
                                    <div class="form-input">
                                        <!-- <input class="form-control" type="password" placeholder="Password"> -->
                                        <input name="password" type="password" value="" class="form-control" id="NewPassword" placeholder="New Password" />
                                        <span class="eyeicon">
                                            <i toggle="#NewPassword" class="uil uil-eye" id="show_eye"></i>
                                        </span>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <div class="form-input">
                                        <!-- <input class="form-control" type="password" placeholder="Password"> -->
                                        <input name="password" type="password" value="" class="form-control" id="ConfirmPassword" placeholder="Confirm New Password" />
                                        <span class="eyeicon">
                                            <i toggle="#ConfirmPassword" class="uil uil-eye" id="show_eye"></i>
                                        </span>
                                    </div>
                                </div>
                                
                                <div class="col-md-12 mt-3 mb-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
                                        <label class="form-check-label font-12" for="flexCheckDefault">
                                            I agree to the <a href="#">Terms and Conditions</a>.
                                        </label>
                                    </div>
                                </div>

                                <div class="col-md-12">
                                    <button class="btn btn-primary">Sign Up Now</button>
                                </div>
                            </div>
                        </form>
                  </div>
                  <div class="dont-have-account">
                      <p>Already have an account? <a href="login.html">Log In</a></p>
                  </div>
               </div>
           </div>
       </div>
   </section>

   <footer class="footer-section">
        <div class="container">
            <div class="copyright">© 2022 ISIT. All rights reserved.</div>
        </div>
   </footer>

<script src="js/jquery-3.6.0.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/custom.js"></script>
</body>
</html>
